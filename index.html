<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BlazeWebGuide — Learn Web Dev From Zero to Pro</title>
<meta name="description" content="A complete, hands-on web development curriculum. HTML, CSS, JavaScript, React, Node, system design and more — from first tag to production.">
<script src="curriculum.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090d;--bg2:#0f1118;--card:#141720;--card2:#191d29;--border:#232838;--border2:#2e3548;
  --text:#e8ecf4;--text2:#9aa3b5;--accent:#6366f1;--accent2:#a5b4fc;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;
  --font:'Inter',sans-serif;--code:'JetBrains Mono',monospace;
  --grad:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#d946ef);
  --shadow:0 10px 40px -12px rgba(0,0,0,.6);
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2b3040;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#3a4155}

.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:236px;background:linear-gradient(180deg,var(--bg2),#0b0d13);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:relative;z-index:5}
.logo{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;background:var(--grad);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.45)}
.logo-text{font-size:14px;font-weight:800;letter-spacing:-.2px}
.logo-text span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);transition:.15s;border:1px solid transparent}
.nav-item:hover{background:rgba(99,102,241,.07);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(99,102,241,.18),rgba(139,92,246,.08));color:#fff;border-color:rgba(99,102,241,.3)}
.nav-item .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 0 rgba(99,102,241,.4)}
.nav-item.active .dot{box-shadow:0 0 8px 2px currentColor}
.nav-item .badge{margin-left:auto;font-size:11px;opacity:.55}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#565e72;padding:12px 12px 6px;font-weight:700}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:0 22px;height:58px;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(8,9,13,.7);backdrop-filter:blur(12px);position:sticky;top:0;z-index:4}
.topbar .btn{padding:7px 16px;border-radius:9px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-weight:600;transition:.15s;font-family:inherit}
.topbar .btn:hover{border-color:var(--accent);color:#fff;background:rgba(99,102,241,.08)}
.topbar .btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.topbar .brand-mobile{display:none;font-weight:800;font-size:14px}
.content{flex:1;overflow-y:auto;padding:30px 36px}
.content::-webkit-scrollbar{width:8px}

/* ===== Home ===== */
.home{max-width:860px;margin:0 auto;padding-top:8px}
.hero{text-align:center;padding:56px 0 32px;position:relative}
.hero::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:520px;height:200px;background:radial-gradient(closest-side,rgba(99,102,241,.28),transparent);filter:blur(30px);pointer-events:none;z-index:-1}
.hero h1{font-size:46px;font-weight:900;letter-spacing:-2px;line-height:1.05}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--text2);max-width:560px;margin:16px auto 28px;font-size:15px;line-height:1.7}
.stats{display:flex;justify-content:center;gap:28px;margin-bottom:32px}
.stat-item{text-align:center;padding:14px 24px;border:1px solid var(--border);border-radius:var(--r);background:var(--card)}
.stat-num{font-size:30px;font-weight:800;letter-spacing:-1px}
.stat-label{font-size:11px;color:var(--text2);margin-top:2px;letter-spacing:.04em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;border:none;cursor:pointer;font-weight:600;font-family:inherit;transition:.18s}
.btn-primary{background:var(--grad);color:#fff;font-size:15px;padding:13px 34px;box-shadow:0 6px 22px rgba(99,102,241,.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(99,102,241,.5)}
.btn-g{padding:8px 16px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;border-radius:9px}
.btn-g:hover{border-color:var(--accent);color:#fff}

.grid{display:grid;gap:14px;margin-top:28px}
.grid-2{grid-template-columns:1fr 1fr}
.card{padding:22px;border:1px solid var(--border);border-radius:var(--r);background:var(--card);cursor:pointer;transition:.2s;overflow-wrap:break-word;word-break:break-word;position:relative}
.card:hover{border-color:rgba(99,102,241,.4);transform:translateY(-3px);box-shadow:var(--shadow);background:var(--card2)}
.card .tag{font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;display:inline-block;margin-bottom:10px;letter-spacing:.04em}
.card h3{font-size:17px;font-weight:700}
.card p{font-size:13px;color:var(--text2);margin-top:6px;line-height:1.6}

/* ===== Level ===== */
.lvl{max-width:680px;margin:0 auto}
.lvl>h2{font-size:24px;font-weight:800;margin-bottom:6px}
.lvl .lvl-sub{color:var(--text2);font-size:13px;margin-bottom:20px}
.acc{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;background:var(--card)}
.acc-h{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.15s}
.acc-h:hover{background:rgba(255,255,255,.02)}
.acc-h .arrow{font-size:9px;color:var(--text2);transition:.2s;flex-shrink:0}
.acc-h .arrow.o{transform:rotate(90deg)}
.acc-h h4{flex:1;font-size:14px;font-weight:700}
.acc-h .cnt{font-size:11px;color:var(--text2)}
.acc-body{border-top:1px solid var(--border);background:var(--bg2)}
.les{padding:10px 16px 10px 38px;cursor:pointer;display:flex;align-items:center;gap:9px;font-size:13px;transition:.1s;border-left:2px solid transparent}
.les:hover{background:rgba(255,255,255,.03)}
.les.active{border-color:var(--accent);background:rgba(99,102,241,.07)}
.les .chk{font-size:11px;width:14px;text-align:center;color:var(--text2);flex-shrink:0}
.les .chk.d{color:var(--green)}
.les .ttl{flex:1;font-weight:500}
.les .dur{font-size:10px;color:var(--text2)}

/* ===== Lesson ===== */
.les-view{max-width:760px;margin:0 auto}
.les-top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.les-top h2{font-size:24px;font-weight:800;flex:1;min-width:200px;letter-spacing:-.5px}
.les-body{line-height:1.75;font-size:15px;color:#cdd4e0}
.les-body h3{font-size:19px;font-weight:700;margin:26px 0 10px;color:#fff}
.les-body p{margin:12px 0}
.les-body ul,.les-body ol{margin:12px 0 12px 22px}
.les-body li{margin:5px 0}
.les-body code{font-family:var(--code);background:rgba(99,102,241,.12);color:var(--accent2);padding:2px 6px;border-radius:5px;font-size:13px}
.les-body pre{background:#0a0c12;border:1px solid var(--border);border-radius:10px;padding:16px;overflow-x:auto;margin:14px 0;font-size:13px}
.les-body pre code{background:none;color:#c9d4e8;padding:0}
.les-body blockquote{border-left:3px solid var(--accent);background:rgba(99,102,241,.06);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;color:var(--text2)}
.les-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}

/* ===== Challenge ===== */
.chal-view{max-width:760px;margin:0 auto}
.chal-view pre{background:#0a0c12;border:1px solid var(--border);border-radius:10px;padding:16px;overflow-x:auto;margin:14px 0;font-family:var(--code);font-size:13px}
.chal-view .hint{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);color:var(--amber);padding:12px 14px;border-radius:10px;font-size:13px;margin:14px 0}
.chal-view textarea{width:100%;min-height:180px;background:#0a0c12;border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--code);font-size:13px;padding:14px;outline:none;resize:vertical}
.chal-view textarea:focus{border-color:var(--accent)}
.feedback{margin-top:12px;font-size:13px;padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);line-height:1.6}
.feedback pre{background:#0a0c12;border-radius:8px;padding:10px;margin-top:8px;overflow-x:auto;font-size:12px;font-family:var(--code)}

/* ===== Profile ===== */
.prof{max-width:640px;margin:0 auto}
.prof-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:26px;margin-bottom:20px}
.prof h2{font-size:22px;font-weight:800;margin-bottom:6px}
.prof .sub{color:var(--text2);font-size:13px;margin-bottom:18px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-box .num{font-size:26px;font-weight:800}
.stat-box .lab{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

/* ===== Cert ===== */
.cert-view{max-width:560px;margin:0 auto;text-align:center}
.cert-view .box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:30px}

/* ===== AI ===== */
.ai-btn{position:fixed;bottom:22px;right:22px;width:54px;height:54px;border-radius:50%;background:var(--grad);border:none;color:#fff;font-size:22px;cursor:pointer;z-index:999;box-shadow:0 6px 20px rgba(99,102,241,.5);transition:.25s;display:flex;align-items:center;justify-content:center}
.ai-btn:hover{transform:scale(1.08) rotate(8deg)}
.ai-btn .pulse{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(139,92,246,.5);animation:pl 2s infinite}
@keyframes pl{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.ai-panel{position:fixed;bottom:86px;right:22px;width:370px;height:500px;background:var(--card);border:1px solid var(--border2);border-radius:18px;z-index:998;display:none;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.ai-panel.o{display:flex;animation:panelIn .22s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.ai-h{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;background:linear-gradient(90deg,rgba(99,102,241,.12),transparent)}
.ai-h .ico{width:30px;height:30px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:15px}
.ai-h h3{font-size:14px;font-weight:700;flex:1}
.ai-h span{font-size:10px;color:var(--text2);font-weight:500}
.ai-h button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px}
.ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;font-size:13px;line-height:1.55}
.ai-msg{max-width:88%;padding:11px 14px;border-radius:12px;animation:msgIn .2s ease}
.ai-msg.b{background:var(--bg2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.ai-msg.u{background:var(--grad);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.ai-msg pre{background:rgba(0,0,0,.35);border-radius:8px;padding:10px;margin:6px 0;font-size:12px;overflow-x:auto;font-family:var(--code)}
.ai-in{padding:12px;border-top:1px solid var(--border);display:flex;gap:9px}
.ai-in input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-size:13px;outline:0;font-family:inherit}
.ai-in input:focus{border-color:var(--accent)}
.ai-in button{width:40px;height:40px;border-radius:10px;border:none;background:var(--grad);color:#fff;cursor:pointer;font-size:15px;flex-shrink:0}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){
  .grid-2{grid-template-columns:1fr}
  .content{padding:18px}
  .hero h1{font-size:34px}
  .sidebar{width:200px}
  .stats{gap:14px}
  .stat-num{font-size:24px}
}
@media(max-width:640px){
  .sidebar{display:none}
  .topbar .brand-mobile{display:block}
  .topbar .btn{display:none}
  .topbar{justify-content:flex-start}
  .content{padding:16px}
  .hero h1{font-size:28px;letter-spacing:-1px}
  .hero p{font-size:14px}
  .stats{gap:10px;flex-wrap:wrap}
  .stat-item{padding:12px 16px;min-width:88px}
  .stat-num{font-size:22px}
  .grid-2{gap:10px}
  .card{padding:17px}
  .card h3{font-size:15px}
  .les-top h2{font-size:20px}
  .ai-btn{width:48px;height:48px;font-size:19px;bottom:16px;right:16px}
  .ai-panel{width:calc(100vw - 28px);height:58vh;bottom:72px;right:14px;left:14px}
}

/* ===== Lesson view (generated) ===== */
.les-v{max-width:760px;margin:0 auto;padding-top:6px}
.crumb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:14px}
.crumb span{opacity:.6}
.les-v h1{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.2;margin-bottom:8px}
.les-v .meta{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);background:var(--card);border:1px solid var(--border);padding:5px 12px;border-radius:20px;margin-bottom:24px}
.les-v .body{line-height:1.8;font-size:15px;color:#ccd3e0}
.les-v .body h1,.les-v .body h2,.les-v .body h3{color:#fff;font-weight:700;margin:26px 0 10px;letter-spacing:-.3px}
.les-v .body h1{font-size:24px}.les-v .body h2{font-size:21px}.les-v .body h3{font-size:18px}
.les-v .body p{margin:12px 0}
.les-v .body ul,.les-v .body ol{margin:12px 0 12px 24px}
.les-v .body li{margin:6px 0}
.les-v .body code{font-family:var(--code);background:rgba(99,102,241,.14);color:var(--accent2);padding:2px 7px;border-radius:5px;font-size:13px}
.les-v .body pre{background:#0a0c12;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:16px 18px;overflow-x:auto;margin:16px 0;font-size:13px}
.les-v .body pre code{background:none;color:#cdd6ea;padding:0}
.les-v .body blockquote{border-left:3px solid var(--accent);background:linear-gradient(90deg,rgba(99,102,241,.08),transparent);padding:14px 18px;border-radius:0 10px 10px 0;margin:16px 0;color:var(--text2);font-style:italic}
.challenge-box{margin-top:28px;background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(245,158,11,.03));border:1px solid rgba(245,158,11,.3);border-radius:14px;padding:20px;cursor:pointer;transition:.2s;position:relative}
.challenge-box:hover{border-color:var(--amber);transform:translateY(-2px)}
.challenge-box strong{color:var(--amber);font-size:14px;display:flex;align-items:center;gap:8px}
.challenge-box p{font-size:13px;color:var(--text2);margin-top:8px;line-height:1.6}
.les-act{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap;padding-top:22px;border-top:1px solid var(--border)}

/* ===== Challenge (generated) ===== */
.chal-view{max-width:860px;margin:0 auto}
.chal-view .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.chal-view .bar span{flex:1;font-size:12px;color:var(--text2)}
.chal-view .bar button{padding:6px 14px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:.15s}
.chal-view .bar button:hover{border-color:var(--green);color:var(--green)}
.chal-view .bar button.sec:hover{border-color:var(--amber);color:var(--amber)}
.chal-view .editor{width:100%;min-height:170px;background:#0a0c12;color:#e2e8f0;border:none;border-bottom:1px solid var(--border);padding:16px;font-family:var(--code);font-size:13px;resize:vertical;outline:none}
.chal-preview{height:220px;background:#fff;border:none}
.chal-preview iframe{width:100%;height:100%;border:none;background:#fff}
.chal-feedback{margin-top:14px}

/* Progress bar (profile) */
.prog-track{height:8px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;flex:1;min-width:60px}
.prog-fill{height:100%;border-radius:6px;transition:width .4s ease}

</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="logo"><div class="logo-mark">B</div><div class="logo-text">Blaze<span>Web</span>Guide</div></div>
    <div class="nav" id="nav"></div>
  </div>
  <main class="main">
    <div class="topbar">
      <div class="brand-mobile">Blaze<span style="background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent">Web</span>Guide</div>
      <div style="flex:1"></div>
      <div class="btn" onclick="showHome()">Home</div>
      <div class="btn" onclick="showProfile()">Profile</div>
      <div class="btn" onclick="showCert()">Cert</div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<button class="ai-btn" id="aiBtn" onclick="toggleAI()" title="Ask AI"><span class="pulse"></span>🤖</button>
<div class="ai-panel" id="aiPanel">
  <div class="ai-h"><div class="ico">🧠</div><h3>Blaze AI Tutor</h3><span>online</span><button onclick="toggleAI()">✕</button></div>
  <div class="ai-msgs" id="aiMsgs"><div class="ai-msg b">Hi! I'm your AI tutor. Ask me anything about web development!</div></div>
  <div class="ai-in"><input id="aiInp" placeholder="Ask a question..." onkeydown="if(event.key==='Enter')sendAI()"><button onclick="sendAI()">➤</button></div>
</div>
<script>
const API='https://quest-seq-medicaid-surveys.trycloudflare.com';
var LVL=null,MOD=null,LES=null,VIEW='home',CONTENT={},CONTENT_LOADED=false,PROGRESS={},USER=localStorage.getItem('bwg_user')||null;

try{PROGRESS=JSON.parse(localStorage.getItem('bwg_prog')||'{}')}catch(e){}
function saveP(){
  localStorage.setItem('bwg_prog',JSON.stringify(PROGRESS));
  // Sync to backend if logged in
  if(USER){
    localStorage.setItem('bwg_prog_sync_'+USER,JSON.stringify(PROGRESS));
    fetch(API+'/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:USER,completed:Object.keys(PROGRESS).filter(k=>PROGRESS[k])})}).catch(function(){});
  }
}
function done(id){return!!PROGRESS[id]}
function lvlP(id){const l=CURRICULUM[id];if(!l)return{d:0,t:0,p:0};let t=0,d=0;l.modules.forEach(m=>m.lessons.forEach(l=>{t++;if(PROGRESS[l.id])d++}));return{d,t,p:t?Math.round(d/t*100):0}}
function lvlDone(id){const x=lvlP(id);return x.t>0&&x.p>=100}
function lvlUnlocked(id){const i=['beginner','intermediate','advanced','pro'].indexOf(id);return i===0||lvlDone(['beginner','intermediate','advanced','pro'][i-1])}

// Admin auto-complete
function checkAdmin(){if(USER&&(USER==='Randyblazedev'||USER==='randyblazedev')&&typeof CURRICULUM!=='undefined'){var ids=[];Object.values(CURRICULUM).forEach(l=>l.modules.forEach(m=>m.lessons.forEach(l=>ids.push(l.id))));ids.forEach(function(id){PROGRESS[id]=true;});localStorage.setItem('bwg_prog',JSON.stringify(PROGRESS));}}

function render(){checkAdmin();
  const keys=['beginner','intermediate','advanced','pro'];
  const colors={beginner:'#22c55e',intermediate:'#3b82f6',advanced:'#f59e0b',pro:'#ef4444'};
  const names={beginner:'Beginner',intermediate:'Intermediate',advanced:'Advanced',pro:'Pro'};
  document.getElementById('nav').innerHTML='<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text2);padding:4px 12px 8px">Levels</div>'+

    var c=code.toLowerCase();

    var hasStructure=c.includes('<!DOCTYPE')||c.includes('<html')||c.includes('<body')||c.includes('<h1')||c.includes('<p')||c.includes('<div');

function findLes(){
  if(!LVL||!LES)return null;
  for(const m of(CURRICULUM[LVL]&&CURRICULUM[LVL].modules||[]))for(const l of m.lessons)if(l.id===LES)return l;
  return null;
}
function findNextLes(){
  const lvl=CURRICULUM[LVL];if(!lvl)return null;
  for(let mi=0;mi<lvl.modules.length;mi++)for(let li=0;li<lvl.modules[mi].lessons.length;li++){
    if(lvl.modules[mi].lessons[li].id===LES){
      if(li+1<lvl.modules[mi].lessons.length)return{id:lvl.modules[mi].lessons[li+1].id,m:lvl.modules[mi].id,l:LVL};
      if(mi+1<lvl.modules.length)return{id:lvl.modules[mi+1].lessons[0].id,m:lvl.modules[mi+1].id,l:LVL};
      return null;
    }
  }return null;
}

function showVerify(certId){
  document.getElementById('content').innerHTML='<div style="text-align:center;padding:40px"><h2 style="font-size:20px;font-weight:700;margin-bottom:16px">🔍 Verifying...</h2><p style="color:var(--text2)">'+certId+'</p></div>';
  fetch(API+'/api/cert/verify/'+certId).then(r=>r.json()).then(d=>{
    if(d.valid){
      const colors={beginner:'#22c55e',intermediate:'#3b82f6',advanced:'#f59e0b',pro:'#ef4444'};
      document.getElementById('content').innerHTML='<div style="max-width:600px;margin:0 auto;text-align:center;padding:40px 0"><div style="width:64px;height:64px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px">✅</div><h2 style="font-size:22px;font-weight:700">Valid Certificate</h2><p style="color:var(--text2);margin:8px 0"><strong>'+d.cert.name+'</strong></p><p style="color:var(--text2);font-size:13px">Completed the <strong>'+d.cert.level+'</strong> level of BlazeWebGuide</p><p style="color:var(--text2);font-size:12px;margin-top:4px">Issued on '+new Date(d.cert.date).toLocaleDateString()+'</p><p style="font-size:11px;color:var(--green);margin-top:12px">Certificate ID: '+certId+'</p><button class="btn btn-g" onclick="showHome()" style="margin-top:16px">← Back</button></div>';
    } else {
      document.getElementById('content').innerHTML='<div style="max-width:500px;margin:0 auto;text-align:center;padding:40px 0"><div style="width:64px;height:64px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px">❌</div><h2 style="font-size:22px;font-weight:700">Certificate Not Found</h2><p style="color:var(--text2);font-size:13px;margin-top:8px">No certificate matches '+certId+'</p><button class="btn btn-g" onclick="showHome()" style="margin-top:16px">← Back</button></div>';
    }
  }).catch(function(){
    document.getElementById('content').innerHTML='<div style="text-align:center;padding:40px"><h2 style="font-size:20px;font-weight:700">Verification Unavailable</h2><p style="color:var(--text2);font-size:13px">Could not reach verification server.</p><button class="btn btn-g" onclick="showHome()" style="margin-top:16px">← Back</button></div>';
  });
}

function init(){
  var v=new URLSearchParams(window.location.search).get('verify');
  if(v){VIEW='verify';setTimeout(function(){showVerify(v);},300);}
  if(typeof CURRICULUM==='undefined'||!CURRICULUM.beginner){
    document.getElementById('content').innerHTML='<p style="text-align:center;padding:40px">Loading...</p>';
    setTimeout(init,200);return;
  }
  if(!v)render();
}
init();
